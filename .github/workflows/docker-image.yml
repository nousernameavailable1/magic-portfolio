name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

# Superseded builds must not publish an older commit over latest.
concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: website
            context: .
            suffix: ""
          - name: bridge
            context: ./deploy/host-agent
            suffix: -host-bridge
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test host bridge
        if: matrix.target.name == 'bridge'
        run: python3 -B -m unittest discover -s deploy/host-agent -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish by digest; only the merge job may update shared release tags.
      - name: Build and push native image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.target.context }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            DEPLOYMENT_COMMIT_SHA=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}${{ matrix.target.suffix }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}-${{ matrix.platform.arch }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}-digests-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish ${{ matrix.target.name }} (AMD64 + ARM64)
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - name: website
            suffix: ""
          - name: bridge
            suffix: -host-bridge
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.target.suffix }}

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.target.name }}-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("${IMAGE}@sha256:${digest}")
          done
          [[ ${#sources[@]} -eq 2 ]]
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_SHA}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)'
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_SHA}"
